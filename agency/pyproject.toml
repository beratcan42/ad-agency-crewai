[project]
name = "ad-agency"
version = "0.2.0"
description = "CrewAI Multi-Agent Reklam Ajansi - FastAPI orchestrator"
requires-python = ">=3.11,<3.13"
authors = [{ name = "Berat" }]

# Pinleme stratejisi:
# - Sabit: crewai (1.14.3 - plana sadık), fastapi, celery
# - Esnek üst sınır: pydantic/httpx/openai/litellm (crewai transitive olarak getirir,
#   çakışma riskini azaltmak için pin'siz bırakıldı)
dependencies = [
  # --- Core multi-agent framework ----------------------------
  "crewai==1.14.3",
  "crewai-tools>=1.14,<1.16",

  # --- LLM client (router omurgasi - hibrit OpenRouter/Gemini/Ollama) ---
  # CrewAI 1.14.3 artik litellm'i transitive getirmiyor (openai'ya gecti).
  # Bu yuzden ayri pin gerekiyor. Versiyon pin'siz - crewai-uyumlu seciliyor.
  "litellm",

  # --- API katmani ------------------------------------------
  "fastapi==0.136.1",
  "uvicorn[standard]==0.35.0",
  "pydantic-settings==2.10.1",

  # --- Veri katmani -----------------------------------------
  "asyncpg==0.30.0",
  "psycopg[binary]==3.2.5",
  "sqlalchemy[asyncio]==2.0.36",
  "alembic==1.14.0",
  "redis[hiredis]==5.2.1",
  "pgvector==0.3.6",

  # --- Celery + queue ---------------------------------------
  "celery[redis]==5.6.3",

  # --- Observability ----------------------------------------
  "langfuse==4.6.1",
  # OpenTelemetry api/sdk crewai (~=1.34) tarafindan getiriliyor.
  # Instrumentation paketleri pin'siz - pip cozsun:
  "opentelemetry-instrumentation-fastapi",
  "opentelemetry-instrumentation-celery",
  "opentelemetry-instrumentation-asyncpg",
  "opentelemetry-instrumentation-redis",
  "structlog==24.4.0",

  # --- Yardimcilar ------------------------------------------
  "pyyaml==6.0.2",
  "python-multipart==0.0.18",
  "tenacity==9.0.0",
  "watchdog==6.0.0",
  "orjson==3.10.12",
  "packaging>=24.0",
]

[project.optional-dependencies]
dev = [
  "pytest==8.3.4",
  "pytest-asyncio==0.25.0",
  "pytest-cov==6.0.0",
  "httpx==0.28.1",
  "ruff==0.8.4",
  "mypy==1.13.0",
  "ipython==8.30.0",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC"]
ignore = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
