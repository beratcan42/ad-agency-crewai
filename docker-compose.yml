# =================================================================
# CrewAI Multi-Agent Reklam Ajansi - Docker Compose
# =================================================================
# Asamali acilis - her servis kendi profili icinde:
#   core    : postgres + redis (Asama 1 - SU AN AKTIF)
#   agents  : agency-api + workers (Asama 2-3)
#   memory  : obsidian-mcp + vault-watcher (Asama 4)
#   ui      : flowise + crm-service (Asama 7-8)
#   social  : postiz (Asama 6)
#   obs     : langfuse + langfuse-db (Asama 5)
#   mcp     : mcp-gateway (Asama 6)
#
# Calistirma:
#   docker compose --profile core up -d
#   docker compose --profile core --profile agents up -d
#   docker compose --profile "*" up -d        # tum sistem
# =================================================================

name: adagency

networks:
  agency_net:
    name: agency_net
    driver: bridge

volumes:
  postgres_data:
    name: adagency_postgres_data
  redis_data:
    name: adagency_redis_data

services:

  # ===============================================================
  # CORE PROFILE (Asama 1)
  # ===============================================================

  postgres:
    image: pgvector/pgvector:pg16
    container_name: adagency-postgres
    restart: unless-stopped
    profiles: [core, agents, memory, ui, social, obs]
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8 --locale=C"
      TZ: ${TZ}
      PGTZ: ${TZ}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/sql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB} -q"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - agency_net
    deploy:
      resources:
        limits:
          memory: 1g

  redis:
    image: redis:7-alpine
    container_name: adagency-redis
    restart: unless-stopped
    profiles: [core, agents, memory, ui, social, obs]
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD}
      --maxmemory 512mb
      --maxmemory-policy allkeys-lru
      --save 60 1000
      --appendonly yes
      --appendfsync everysec
      --tcp-keepalive 60
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a $$REDIS_PASSWORD ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      TZ: ${TZ}
    networks:
      - agency_net
    deploy:
      resources:
        limits:
          memory: 640m

  # ===============================================================
  # AGENTS PROFILE (Asama 2-3) - PLACEHOLDER, sonraki asamada doldurulacak
  # ===============================================================
  # agency-api:
  #   build: ./agency
  #   ...
  #
  # agency-worker:
  #   build: ./agency
  #   command: celery -A src.tasks worker -Q q_heavy,q_fast,q_io,q_research
  #   ...

  # ===============================================================
  # MEMORY PROFILE (Asama 4) - PLACEHOLDER
  # ===============================================================
  # obsidian-mcp:
  #   image: obsidian-mcp:rust-latest
  #   ...

  # ===============================================================
  # UI PROFILE (Asama 7-8) - PLACEHOLDER
  # ===============================================================
  # flowise:
  #   image: flowiseai/flowise:3.1.2
  #   ...
